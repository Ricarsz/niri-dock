name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust gtk4 gtk4-layer-shell github-cli

      - name: Build package from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          useradd -m builder
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /work
          chown -R builder:builder /work
          su builder -c 'cd /work && makepkg -f --noconfirm --nodeps'

      - name: Collect release assets
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /out
          # makepkg 可能同时产出 -debug 包；只取主包，避免 bsdtar 把两个文件当成 archive+member
          pkg="$(find /work -maxdepth 1 -name 'niri-dock-*.pkg.tar.zst' ! -name '*-debug-*' | head -n 1)"
          test -n "$pkg"
          cp "$pkg" /out/
          bsdtar -xOf "$pkg" usr/bin/niri-dock > /out/niri-dock
          chmod 755 /out/niri-dock
          tar -czf "/out/niri-dock-${version}-x86_64.tar.gz" -C /out niri-dock
          rm -f /out/niri-dock

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 只上传构建产物；LICENSE/README 由仓库本身承载，不再作为 release asset
          assets=("/out/$(basename "$pkg")" "/out/niri-dock-${version}-x86_64.tar.gz")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "niri-dock ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${assets[@]}" \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
