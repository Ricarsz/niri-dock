name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust gtk4 gtk4-layer-shell github-cli

      - name: Build package from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          useradd -m builder
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /work
          chown -R builder:builder /work
          su builder -c 'cd /work && makepkg -f --noconfirm --nodeps'

      - name: Collect release assets
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /out
          cp /work/*.pkg.tar.zst /out/
          bsdtar -xOf /work/*.pkg.tar.zst usr/bin/niri-dock > /out/niri-dock
          chmod 755 /out/niri-dock
          tar -czf "/out/niri-dock-${version}-x86_64.tar.gz" -C /out niri-dock
          rm -f /out/niri-dock
          cp /work/LICENSE /work/README.md /out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "niri-dock ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            /out/* \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber /out/*
