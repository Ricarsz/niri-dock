[package]
name = "niri-dock"
version = "0.1.2"
edition = "2021"
description = "macOS-style dock for the niri Wayland compositor"
license = "MIT"
repository = "https://github.com/Ricarsz/niri-dock"
keywords = ["niri", "dock", "wayland", "gtk4"]
categories = ["gui"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
